name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VITE_SUPABASE_URL: "https://mock.supabase.co"
  VITE_SUPABASE_ANON_KEY: "mock-key"
  SUPABASE_URL: "https://mock.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "mock-key"
  VITE_FIREBASE_PROJECT_ID: "mock-project"
  VITE_FIREBASE_API_KEY: "mock-key"
  VITE_FIREBASE_AUTH_DOMAIN: "mock.firebaseapp.com"
  VITE_FIREBASE_STORAGE_BUCKET: "mock.firebasestorage.app"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx tsc --noEmit
      # Removing `npm run lint` as there is no eslint configured in package.json yet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run test

  db-validation:
    runs-on: ubuntu-latest
    # Assuming the environment has SUPABASE credentials provided as secrets
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run db:validate-constraints

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run build
